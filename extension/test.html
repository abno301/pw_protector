<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Autofill Extension</title>
  </head>
  <body>
    <h1>Login Form for Testing</h1>
    <p>
      Use this form to test the autofill functionality of your Chrome extension.
    </p>

    <form id="login-form">
      <label for="username">Username:</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter username"
        required
      />
      <br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        required
      />
      <br /><br />

      <button type="submit">Login</button>
    </form>

    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          alert("Form submitted!");
        });
    </script>
  </body>
</html>
